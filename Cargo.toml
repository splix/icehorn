[package]
name = "icehorn"
version = "0.3.0-dev"
edition = "2024"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
anyhow = "1.0"
apache-avro = { version = "0.21", features = ["zstandard", "snappy"] }
tokio = { version = "1.50", features = ["rt-multi-thread", "macros"] }
shutdown = "0.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
object_store = { version = "0.13", features = ["tokio", "aws"] }
bytes = "1"
flate2 = "1"
futures = "0.3"
jiff = "0.2"
tokio-util = { version = "0.7", features = ["io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = "1"
ratatui = "0.30"
tui-logger = { version = "0.18", default-features = false, features = ["tracing-support"] }

[dev-dependencies]
tokio = { version = "1.50", features = ["test-util"] }